program: test.py
project: cs6886-a2-mobilenetv2-cifar10
method: grid
metric:
  name: quantized_acc
  goal: maximize
parameters:
  weight_quant_bits:
    values: [2, 3, 4, 6, 8]
  activation_quant_bits:
    values: [2, 3, 4, 6, 8]
  prune_sparsity:
    values: [0.0]
command:
  - ${env}
  - python3
  - ${program}
  - ${args}
